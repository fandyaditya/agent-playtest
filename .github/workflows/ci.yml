name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  # Fast, deterministic, no browser: this is the gate every PR must pass.
  quality:
    name: quality (typecheck, lint, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # The consumer entry point: tarball -> throwaway project -> `gameprob` bin.
  cli-smoke:
    name: cli-smoke (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:package
      - run: pnpm verify:install

  # Real Chromium, real WebGL, real daemon, the bundled example game.
  browser-integration:
    name: browser-integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's Chromium plus the shared libraries it links against.
      # Software rendering is fine here: these tests assert structure and
      # non-blank frames, never GPU fidelity or frame rate.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:integration
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-output
          path: |
            examples/spinner/.gameprob/output/
            tests/.tmp/
          if-no-files-found: ignore
          retention-days: 7
